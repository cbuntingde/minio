name: Publish Container Image

# Builds this fork from source and publishes a multi-arch image to GHCR.
# Nothing else in this repository publishes images: docker-buildx.sh targets
# MinIO's internal registry, and the legacy Dockerfile.release* variants
# download the frozen upstream binary from dl.min.io.
on:
  push:
    branches:
      - master
    tags:
      - "v*"
      - "RELEASE.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish for this manual build (default: manual)"
        required: false
        default: manual

permissions:
  contents: read
  packages: write

jobs:
  preflight:
    name: Verify GHCR push access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # GHCR only grants an Actions token push access to a package that is
      # linked to this repository, and the link is created by the first publish
      # *from* a repository. If ghcr.io/<owner>/<repo> already exists from an
      # earlier, differently-credited push, GITHUB_TOKEN is refused with
      # "denied: permission_denied: write_package". GHCR never grants push for
      # an unlinked package name (nor for names that match no repository), so
      # check the grant up front and fail with the fix in seconds instead of
      # after a full build.
      - name: Check the registry grant for ${{ github.repository }}
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          token="${GHCR_TOKEN:-$GITHUB_TOKEN}"
          scope="repository:${{ github.repository }}:pull,push"
          code=$(curl -s -H "Authorization: Bearer $token" -o /tmp/grant.json -w '%{http_code}' \
            "https://ghcr.io/token?service=ghcr.io&scope=$scope")
          actions=$(jq -r '.token // empty' /tmp/grant.json | awk -F. '{print $2}' \
            | tr '-_' '+/' \
            | awk '{ l = length($0) % 4; if (l) $0 = $0 substr("====", 1, 4 - l); print }' \
            | base64 -d 2>/dev/null | jq -r '[.access[]?.actions[]?] | join(",")' 2>/dev/null || true)
          echo "ghcr.io scope '$scope': http=$code actions=${actions:-none}"
          if [ "$code" = "200" ] && printf ',%s,' "$actions" | grep -q ',push,'; then
            echo "push access confirmed"
            exit 0
          fi

          if [ "$code" != "403" ]; then
            # Not an access decision: the registry is unreachable or erroring.
            echo "::error title=GHCR unavailable::could not verify push access for ${{ github.repository }} (http=$code)."
            {
              echo "### Could not verify GHCR push access"
              echo
              echo "ghcr.io answered http=\`$code\` instead of an authorization decision,"
              echo "so this is a registry availability problem rather than a permission one."
              echo "Registry response: \`$(tr -d '\n' < /tmp/grant.json)\`"
              echo
              echo "Check <https://www.githubstatus.com/> and re-run the workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/grant.json
            exit 1
          fi

          echo "::error title=GHCR push denied::ghcr.io did not grant push access for ${{ github.repository }} (http=$code, actions=${actions:-none})."
          {
            echo "### GHCR push access denied"
            echo
            echo "ghcr.io did not grant push access for \`${{ github.repository }}\`"
            echo "(http=\`$code\`, granted actions=\`${actions:-none}\`)."
            echo
            echo "**Cause**: \`ghcr.io/${{ github.repository }}\` already exists but is not"
            echo "linked to this repository, so the Actions token has no write access to it."
            echo "GHCR only grants push for a package that is linked to the pushing repository."
            echo
            echo "**Fix (pick one)**"
            echo
            echo "1. Grant this repository write access to the existing package:"
            echo "   https://github.com/users/${{ github.repository_owner }}/packages/container/${{ github.event.repository.name }}/settings"
            echo "   -> \`Manage Actions access\` -> \`Add Repository\` -> \`${{ github.repository }}\` -> Role: **Write**"
            echo
            echo "2. Publish with a personal access token that has the \`write:packages\` scope:"
            echo "   store it as the repository secret \`GHCR_TOKEN\`; this workflow prefers that"
            echo "   secret over \`GITHUB_TOKEN\`."
            echo
            echo "Registry response: \`$(tr -d '\n' < /tmp/grant.json)\`"
          } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/grant.json
          exit 1

  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: [preflight]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Native runners per architecture. Building arm64 under QEMU emulation
        # took ~20 minutes and was flaky; the native arm64 runner is a few
        # minutes. Each leg pushes a single-arch image addressed by digest, and
        # the publish job below stitches them into one multi-arch manifest.
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          # GHCR_TOKEN (a PAT with write:packages) takes precedence when set:
          # see the preflight job for why GITHUB_TOKEN may be refused.
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for the image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Note: github.event.inputs (not the inputs context) is used so the
          # expression stays valid for push/tag events as well as dispatch.
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ github.event.inputs.tag || 'manual' }},enable=${{ github.event_name == 'workflow_dispatch' }}

      # No tag is applied here: the image is pushed by digest only so that the
      # publish job can compose both architectures into a single tagged
      # manifest list.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.source
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            RELEASE=${{ github.ref_name }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-arch manifest to ghcr.io
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for the image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ github.event.inputs.tag || 'manual' }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Create the multi-arch manifest and push all tags
        working-directory: /tmp/digests
        run: |
          tag_args=()
          while IFS= read -r tag; do
            tag_args+=("-t" "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")

          digest_args=()
          for digest in *; do
            digest_args+=("ghcr.io/${{ github.repository }}@sha256:$digest")
          done

          printf 'creating manifest for: %s\n' "${digest_args[@]}"
          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"

      - name: Inspect the published image
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
