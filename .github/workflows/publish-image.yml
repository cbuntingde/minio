name: Publish Container Image

# Builds this fork from source and publishes a multi-arch image to GHCR.
# Nothing else in this repository publishes images: docker-buildx.sh targets
# MinIO's internal registry, and the legacy Dockerfile.release* variants
# download the frozen upstream binary from dl.min.io.
on:
  push:
    branches:
      - master
    tags:
      - "v*"
      - "RELEASE.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish for this manual build (default: manual)"
        required: false
        default: manual

permissions:
  contents: read
  packages: write

jobs:
  preflight:
    name: Verify GHCR push access
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # ghcr.io's token endpoint is not a usable oracle for this. It answers
      # 403 DENIED for a completely invalid bearer token just as readily as for
      # a valid one that lacks write access, so probing it cannot tell a token
      # that cannot push from one that can. It reported this repository as
      # denied while a PAT with write:packages pushed to it without complaint.
      #
      # So probe the real mechanism instead: push an empty image. It builds in
      # seconds, and a denial is the same write_package error the build would
      # otherwise hit ten minutes later.
      #
      # The target is the real repository name on purpose. A name that does not
      # exist yet would simply be created and linked by the push, which answers
      # a different question from whether an existing package accepts writes.
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Push an empty image to prove write access
        run: |
          mkdir -p /tmp/canary
          printf 'FROM scratch\n' > /tmp/canary/Dockerfile
          if docker buildx build --push \
            --tag "ghcr.io/${{ github.repository }}:push-probe" \
            --file /tmp/canary/Dockerfile \
            /tmp/canary; then
            echo "push access confirmed"
            exit 0
          fi

          echo "::error title=GHCR push denied::could not push to ghcr.io/${{ github.repository }}."
          {
            echo "### GHCR push denied"
            echo
            echo "A push of an empty image to \`ghcr.io/${{ github.repository }}\` was"
            echo "refused, so the build below would fail the same way ten minutes later."
            echo
            echo "**Cause**: GHCR grants write access to a package per repository. If"
            echo "\`ghcr.io/${{ github.repository }}\` already exists but is not linked to this"
            echo "repository, the Actions token has no write access to it."
            echo
            echo "**Fix (pick one)**"
            echo
            echo "1. Grant this repository write access to the existing package:"
            echo "   https://github.com/users/${{ github.repository_owner }}/packages/container/${{ github.event.repository.name }}/settings"
            echo "   -> \`Manage Actions access\` -> \`Add Repository\` -> \`${{ github.repository }}\` -> Role: **Write**"
            echo
            echo "2. Store a personal access token (classic) with the \`write:packages\`"
            echo "   scope as the repository secret \`GHCR_TOKEN\`; this workflow prefers"
            echo "   that secret over \`GITHUB_TOKEN\`."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: [preflight]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Native runners per architecture. Building arm64 under QEMU emulation
        # took ~20 minutes and was flaky; the native arm64 runner is a few
        # minutes. Each leg pushes a single-arch image addressed by digest, and
        # the publish job below stitches them into one multi-arch manifest.
        include:
          # Pinned images: the ubuntu-latest label moves to Ubuntu 26 on
          # 2026-10-19, and the arm64 label is version-pinned anyway.
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          # GHCR_TOKEN (a PAT with write:packages) takes precedence when set:
          # see the preflight job for why GITHUB_TOKEN may be refused.
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for the image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Note: github.event.inputs (not the inputs context) is used so the
          # expression stays valid for push/tag events as well as dispatch.
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ github.event.inputs.tag || 'manual' }},enable=${{ github.event_name == 'workflow_dispatch' }}

      # No tag is applied here: the image is pushed by digest only so that the
      # publish job can compose both architectures into a single tagged
      # manifest list.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.source
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            RELEASE=${{ github.ref_name }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-arch manifest to ghcr.io
    runs-on: ubuntu-24.04
    needs: [build]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for the image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ github.event.inputs.tag || 'manual' }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Create the multi-arch manifest and push all tags
        working-directory: /tmp/digests
        run: |
          tag_args=()
          while IFS= read -r tag; do
            tag_args+=("-t" "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")

          digest_args=()
          for digest in *; do
            digest_args+=("ghcr.io/${{ github.repository }}@sha256:$digest")
          done

          printf 'creating manifest for: %s\n' "${digest_args[@]}"
          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"

      - name: Inspect the published image
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
