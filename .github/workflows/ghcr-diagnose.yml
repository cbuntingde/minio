name: Diagnose GHCR access

# Temporary diagnostic: dumps the GHCR token claims granted to GITHUB_TOKEN and
# probes which package names the token may push to. Distinguishes a broken
# package link (existing name denied, fresh name allowed) from a repo-level
# token permission problem (everything denied).
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe GHCR push grants
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::add-mask::$TOKEN"
          probe() {
            name="$1"
            code=$(curl -s -H "Authorization: Bearer $TOKEN" \
              -o /tmp/tok.json -w '%{http_code}' \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${name}:pull,push")
            actions=$(jq -r '.token // empty' /tmp/tok.json | awk -F. '{print $2}' \
              | tr '-_' '+/' \
              | awk '{ l = length($0) % 4; if (l) $0 = $0 substr("====", 1, 4 - l); print }' \
              | base64 -d 2>/dev/null | jq -r '[.access[]?.actions[]?] | join(",")' 2>/dev/null)
            printf '%-52s http=%s actions=%s body=%s\n' "$name" "$code" "${actions:-none}" \
              "$(tr -d '\n' < /tmp/tok.json | cut -c1-160)"
          }
          probe cbuntingde/minio
          probe cbuntingde/minio-probe-000000000000
          probe cbuntingde/cbuntingde-minio-hardened
          echo "--- repo-level token permissions ---"
          curl -s -H "Authorization: Bearer $TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" | jq -c '{visibility, fork, permissions}'

